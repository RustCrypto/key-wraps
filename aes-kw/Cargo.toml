[package]
name = "aes-kw"
version = "0.3.1"
authors = ["RustCrypto Developers"]
edition = "2024"
rust-version = "1.85"
documentation = "https://docs.rs/aes-kw"
repository = "https://github.com/RustCrypto/key-wraps"
license = "MIT OR Apache-2.0"
keywords = ["crypto", "AES-KW", "KW", "AES-KWP", "KWP"]
categories = ["cryptography", "no-std"]
description = "NIST 800-38F AES Key Wrap (KW) and Key Wrap with Padding (KWP) modes"

[dependencies]
aes = "0.9"
const-oid = { version = "0.10", optional = true }
zeroize = { version = "1.8", optional = true, default-features = false }

[dev-dependencies]
hex-literal = "1"

[features]
default = ["oid"]
oid = ["dep:const-oid"]
zeroize = ["dep:zeroize", "aes/zeroize"]

[package.metadata.docs.rs]
all-features = true
